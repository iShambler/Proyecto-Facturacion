<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Factura</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <!-- PANEL IZQUIERDO: FORMULARIO -->
        <div class="left-panel">
            <div class="header">
                <h1>Solicitar Factura</h1>
                <p>Complete sus datos fiscales para generar la factura</p>
            </div>

            <div id="alertSuccess" class="alert alert-success"></div>
            <div id="alertError" class="alert alert-error"></div>

            <form id="facturaForm" method="POST" action="/generar-factura">
                <div class="form-section">
                    <h2 class="section-title">Datos Fiscales</h2>
                    
                    <div class="form-group">
                        <label>RFC <span class="required">*</span></label>
                        <input type="text" name="rfc" required maxlength="13" placeholder="Ej: XAXX010101000" pattern="[A-ZÑ&]{3,4}[0-9]{6}[A-Z0-9]{3}" style="text-transform: uppercase;">
                    </div>
                    
                    <div class="form-group">
                        <label>Nombre o Razón Social <span class="required">*</span></label>
                        <input type="text" name="nombre" required placeholder="Nombre completo o razón social" style="text-transform: uppercase;">
                    </div>

                    <div class="form-grid-2">
                        <div class="form-group">
                            <label>Código Postal <span class="required">*</span></label>
                            <input type="text" name="cp_receptor" required maxlength="5" pattern="[0-9]{5}" placeholder="Ej: 01000">
                        </div>
                        
                        <div class="form-group">
                            <label>Correo Electrónico <span class="required">*</span></label>
                            <input type="email" name="email" required placeholder="correo@ejemplo.com">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Régimen Fiscal <span class="required">*</span></label>
                        <select name="regimen" required>
                            <option value="">Seleccione un régimen</option>
                            <option value="601">601 - General de Ley Personas Morales</option>
                            <option value="603">603 - Personas Morales con Fines no Lucrativos</option>
                            <option value="605">605 - Sueldos y Salarios e Ingresos Asimilados</option>
                            <option value="606">606 - Arrendamiento</option>
                            <option value="607">607 - Régimen de Enajenación o Adquisición de Bienes</option>
                            <option value="608">608 - Demás ingresos</option>
                            <option value="610">610 - Residentes en el Extranjero sin Establecimiento</option>
                            <option value="611">611 - Ingresos por Dividendos</option>
                            <option value="612">612 - Personas Físicas con Actividades Empresariales</option>
                            <option value="614">614 - Ingresos por intereses</option>
                            <option value="615">615 - Régimen de los ingresos por obtención de premios</option>
                            <option value="616">616 - Sin obligaciones fiscales</option>
                            <option value="620">620 - Sociedades Cooperativas de Producción</option>
                            <option value="621">621 - Incorporación Fiscal</option>
                            <option value="622">622 - Actividades Agrícolas, Ganaderas, Silvícolas</option>
                            <option value="623">623 - Opcional para Grupos de Sociedades</option>
                            <option value="624">624 - Coordinados</option>
                            <option value="625">625 - Régimen de Plataformas Tecnológicas</option>
                            <option value="626">626 - Régimen Simplificado de Confianza</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Uso de CFDI <span class="required">*</span></label>
                        <select name="uso_cfdi" required>
                            <option value="">Seleccione un uso</option>
                            <option value="G01">G01 - Adquisición de mercancías</option>
                            <option value="G02">G02 - Devoluciones, descuentos o bonificaciones</option>
                            <option value="G03">G03 - Gastos en general</option>
                            <option value="I01">I01 - Construcciones</option>
                            <option value="I02">I02 - Mobilario y equipo de oficina</option>
                            <option value="I03">I03 - Equipo de transporte</option>
                            <option value="I04">I04 - Equipo de computo y accesorios</option>
                            <option value="I05">I05 - Dados, troqueles, moldes, matrices</option>
                            <option value="I06">I06 - Comunicaciones telefónicas</option>
                            <option value="I07">I07 - Comunicaciones satelitales</option>
                            <option value="I08">I08 - Otra maquinaria y equipo</option>
                            <option value="D01">D01 - Honorarios médicos, dentales y hospitalarios</option>
                            <option value="D02">D02 - Gastos médicos por incapacidad</option>
                            <option value="D03">D03 - Gastos funerales</option>
                            <option value="D04">D04 - Donativos</option>
                            <option value="D05">D05 - Intereses reales por créditos hipotecarios</option>
                            <option value="D06">D06 - Aportaciones voluntarias al SAR</option>
                            <option value="D07">D07 - Primas por seguros de gastos médicos</option>
                            <option value="D08">D08 - Gastos de transportación escolar</option>
                            <option value="D09">D09 - Depósitos en cuentas para el ahorro</option>
                            <option value="D10">D10 - Pagos por servicios educativos</option>
                            <option value="S01">S01 - Sin efectos fiscales</option>
                            <option value="CP01">CP01 - Pagos</option>
                            <option value="CN01">CN01 - Nómina</option>
                        </select>
                    </div>
                </div>

                <!-- Campos ocultos -->
                <input type="hidden" name="lineas_json" id="lineasJson" value="{{lineas_json}}">
                <input type="hidden" name="numero_ticket" id="numeroTicket" value="{{numero_ticket}}">

                <button type="submit" class="btn-submit" id="btnSubmit">Generar Factura</button>
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p style="margin-top: 15px; color: #000000; font-size: 12px; text-transform: uppercase; letter-spacing: 1px;">Procesando...</p>
                </div>
            </form>
        </div>

        <!-- PANEL DERECHO: PREVIEW DEL TICKET -->
        <div class="right-panel">
            <div class="preview-header">
                <img src="/img/LOGO_MO_MEXICO_dark.webp" alt="Logo" style="max-width: 120px; height: auto; margin-bottom: 15px;">
                <div class="preview-title">Resumen de Compra</div>
                <div class="preview-ticket" id="ticketNumber" style="display: none;">Ticket: <span id="ticketNum"></span></div>
            </div>

            <div class="preview-content">
                <div class="preview-section">
                    <div class="preview-section-title">Productos</div>
                    
                    <div id="lineasProductos">
                        {{lineas_productos}}
                    </div>
                    
                    <div style="border-top: 1px solid #e0e0e0; margin: 20px 0;"></div>
                    
                    <div class="preview-row">
                        <span class="preview-label">Subtotal</span>
                        <span class="preview-value">${{subtotal}} MXN</span>
                    </div>
                    
                    <div class="preview-row">
                        <span class="preview-label">IVA (16%)</span>
                        <span class="preview-value">${{iva}} MXN</span>
                    </div>
                </div>
            </div>

            <div class="preview-total">
                <span class="preview-total-label">Total</span>
                <span class="preview-total-amount">${{total}} MXN</span>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body> 
</html>
